services:
  lexicast:
    build: .
    image: lexicast:dev
    restart: unless-stopped
    # Bound to localhost: put a reverse proxy (TLS) in front. Never publish this port directly.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - lexicast-data:/data
    environment:
      LEXICAST_RATE_PER_MINUTE: "600"
      LEXICAST_AUTH_RATE_PER_MINUTE: ${LEXICAST_AUTH_RATE_PER_MINUTE:-20}
      LEXICAST_WRITE_RATE_PER_MINUTE: ${LEXICAST_WRITE_RATE_PER_MINUTE:-300}
      # Public address behind your TLS proxy; required for correct origin checks and Secure cookies
      LEXICAST_BASE_URL: ${LEXICAST_BASE_URL:-http://127.0.0.1:8787}
      # Mail: off (default), smtp or file (writes mails to /data/outbox, for tests). See .env.example
      LEXICAST_MAIL: ${LEXICAST_MAIL:-off}
      LEXICAST_MAIL_FROM: ${LEXICAST_MAIL_FROM:-}
      LEXICAST_SMTP_HOST: ${LEXICAST_SMTP_HOST:-}
      LEXICAST_SMTP_PORT: ${LEXICAST_SMTP_PORT:-}
      LEXICAST_SMTP_SECURITY: ${LEXICAST_SMTP_SECURITY:-starttls}
      LEXICAST_SMTP_USER: ${LEXICAST_SMTP_USER:-}
      LEXICAST_DIGEST_MINUTES: ${LEXICAST_DIGEST_MINUTES:-15}
      LEXICAST_DEFAULT_LOCALE: ${LEXICAST_DEFAULT_LOCALE:-en}
      # Prefer a secret file over the plain variable LEXICAST_SMTP_PASSWORD:
      # LEXICAST_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      # Behind Cloudflare set: LEXICAST_TRUST_PROXY_HEADER: cf-connecting-ip
      # Restrict browsers to your apps: LEXICAST_ALLOWED_ORIGINS: https://app.example
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  lexicast-data:
